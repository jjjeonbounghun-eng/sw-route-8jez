<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="스위스 동선">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>스위스 자유여행 동선</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 흰 바탕 · 회색 선 · 고른 길만 진한 먹색 · 고른 점 테두리만 스위스 빨강 */
:root{
  --bg:#ffffff; --ink:#1d2327; --sub:#69737a; --faint:#b7bec3; --line-off:#e4e7e9; --line-hover:#a3abb0;
  --red:#d52b1e; --chip:#f3f5f6; --card:#ffffff; --shadow:0 12px 40px rgba(20,28,34,.14),0 2px 8px rgba(20,28,34,.06);
  --f:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased}
body{padding-top:env(safe-area-inset-top,0px);overflow-x:hidden}
button{font:inherit;color:inherit}

header{padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.lead{margin:4px 0 0;font-size:13px;color:var(--sub)}
.lead b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:8px}
.btn{appearance:none;border:1px solid #dfe3e5;background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:var(--chip)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.decs{display:flex;gap:18px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dec{display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
.dec .w{font-size:11px;color:var(--sub);letter-spacing:.02em}
.opts{display:flex;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.opt{appearance:none;border:0;background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap;transition:background .25s,color .25s,box-shadow .25s}
.opt:hover{color:var(--ink)}
.opt[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

.stage{position:relative;height:560px}
.scroller{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
svg{display:block}
.day-bg{fill:#fafbfb}
.day-sep{stroke:#eef0f1;stroke-width:1}
.day-h{font-size:13px;font-weight:600;fill:var(--ink)}
.day-s{font-size:11.5px;fill:var(--sub)}
.day-d{font-family:var(--mono);font-size:12px;fill:var(--sub)}

.e .hit{stroke:transparent;stroke-width:16;fill:none;cursor:pointer}
.e .ln{fill:none;stroke:var(--line-off);stroke-width:1.6;transition:stroke .55s ease,stroke-width .55s ease}
.e:hover .ln{stroke:var(--line-hover)}
.e.on .ln{stroke:var(--ink);stroke-width:2.6}
.e.on .hit{cursor:default}
.e .lb{font-size:11px;fill:var(--sub);opacity:0;transition:opacity .5s ease;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.e:hover .lb,.e.show .lb{opacity:1}

.n{cursor:pointer}
.n .dot{fill:#fff;stroke:var(--faint);stroke-width:1.6;transition:fill .5s,stroke .5s,r .25s}
.n .halo{fill:none;stroke:var(--ink);stroke-width:2;opacity:0;transition:opacity .25s, r .25s}
.n .nm{font-size:12.5px;fill:var(--faint);transition:fill .5s;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.n .tm{font-family:var(--mono);font-size:10.5px;fill:var(--faint);transition:fill .5s;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.n.on .dot{fill:var(--ink);stroke:var(--ink)}
.n.on.home .dot{fill:#fff;stroke:var(--ink);stroke-width:2.6}
.n.on .nm{fill:var(--ink);font-weight:600}
.n.main .dot{stroke:#f0b4ae}
.n.main .nm{fill:#e9a7a1}
.n.main.on .dot{fill:var(--red);stroke:var(--red)}
.n.main.on .nm{fill:var(--red)}
.ic{cursor:pointer}
.ic circle{fill:#fff;stroke:var(--line-off);stroke-width:1.4;transition:stroke .5s}
.ic use{color:#c3c9cd;transition:color .5s}
.ic.on circle{stroke:var(--ink);stroke-width:1.6}
.ic.on use{color:var(--ink)}
.ic:hover circle{stroke:var(--line-hover)}
.ic .tg{fill:#fff;stroke:var(--line-off);stroke-width:1.2;transition:stroke .5s}
.ic .tgt{font-family:var(--mono);font-size:9px;fill:#c3c9cd;transition:fill .5s}
.ic.on .tg{stroke:var(--ink)}
.ic.on .tgt{fill:var(--ink)}
.n .mdot{fill:#e0a100;opacity:0;transition:opacity .3s}
.n.hasmemo .mdot{opacity:1}
.card .memo{margin-top:8px;border-top:1px solid #eef0f1;padding-top:8px}
.card .mh{font-size:11px;color:var(--sub);display:flex;align-items:center;justify-content:space-between}
.card .mt{margin:3px 0 0;font-size:12.5px;line-height:1.55;white-space:pre-wrap;color:var(--ink)}
.card .mt:empty::before{content:'아직 메모가 없어요';color:var(--faint)}
.card .mbtn{appearance:none;border:1px solid #dfe3e5;background:#fff;border-radius:999px;padding:2px 10px;font-size:11.5px;cursor:pointer}
.card .me textarea{width:100%;min-height:70px;font:inherit;font-size:12.5px;line-height:1.5;border:1px solid #cfd4d7;border-radius:8px;padding:7px 9px;resize:vertical;color:var(--ink)}
.card .me textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.card .mrow{display:flex;gap:6px;margin-top:6px}
.card .mbtn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.card:not(.pinned) .mbtn{display:none}
.n.on .tm{fill:var(--sub)}
.n.stop .nm{font-size:11.5px;font-weight:400}
.n.stop .nm,.n.stop .tm{opacity:0;transition:opacity .25s,fill .5s}

.n:hover .dot{stroke:var(--ink)}
.n:focus{outline:none}
.n:focus-visible .halo{opacity:1}
.n.pick .halo{opacity:1}
.n .ph{opacity:0;transition:opacity .25s}
.n:hover .ph,.n.pick .ph{opacity:1}

/* 사진 카드 */
.card{position:fixed;z-index:20;width:300px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;
  opacity:0;transform:translateY(6px) scale(.97);transform-origin:left center;pointer-events:none;transition:opacity .22s ease,transform .28s cubic-bezier(.2,.8,.2,1)}
.card.show{opacity:1;transform:none;pointer-events:auto}
.card .phw{position:relative;aspect-ratio:16/10;background:#eef1f2;overflow:hidden}
.card .phw img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.04);transition:opacity .45s ease,transform .9s ease}
.card .phw img.ok{opacity:1;transform:none}
.card .sat{position:absolute;left:10px;top:10px;font-size:10.5px;background:rgba(255,255,255,.88);border-radius:999px;padding:2px 8px;color:var(--ink)}
.card .bd{padding:12px 14px 13px;display:flex;flex-direction:column;gap:4px}
.card .ttl{font-size:15px;font-weight:600}
.card .th{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .gm{display:inline-flex;align-items:center;gap:4px;flex:none;color:var(--ink);text-decoration:none}
.card .gm[hidden]{display:none}
.card .tm{font-family:var(--mono);font-size:12px;color:var(--sub)}
.card .via{font-size:12.5px;color:var(--ink)}
.card .via span{color:var(--sub)}
.card .via .sep{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:10.5px;font-weight:600;line-height:17px;color:#8a5a00;background:#fbf0d9;vertical-align:1px}
.card .nt{margin:4px 0 0;font-size:12.5px;line-height:1.55;color:#3b4449}
.card .cr{margin-top:6px;font-size:10.5px;color:var(--faint)}
.card .cr a{color:var(--faint)}
.card .x{display:none;position:absolute;right:10px;top:10px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:16px;line-height:30px;cursor:pointer}
.card.noimg .phw{display:none}

.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;opacity:0;transition:opacity .25s,transform .3s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

.tip{position:fixed;z-index:25;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 10px;border-radius:8px;opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s;white-space:nowrap}
.tip.show{opacity:1;transform:none}
html{scrollbar-width:none} html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
.ckrow{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;column-gap:14px;max-width:none!important} /* 체크리스트 제목과 상태 글을 같은 바닥선에 */
.stat{display:flex;gap:14px;margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}

/* 준비 체크리스트 */
.ck{padding:0 20px 80px}
.ckgo{display:flex;align-items:center;gap:7px;appearance:none;border:0;background:none;padding:10px 0 14px;margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;color:#c3c9cd;cursor:pointer;transition:color .45s}
.ckgo h2{margin:0;font:inherit}
.ckgo svg{width:11px;height:1em;overflow:visible}
.ckgo path{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;animation:chev 1.8s ease-in-out infinite}
.ckgo path:nth-child(2){animation-delay:.18s}
.ckgo path:nth-child(3){animation-delay:.36s}
@keyframes chev{0%,60%,100%{opacity:.35}25%{opacity:1}}
.ck.near .ckgo{color:var(--ink)}
.ck.near .ckgo svg{opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
.ckh{display:inline-grid;row-gap:9px;min-width:var(--tw,0px);margin:0 0 4px} /* 두 줄의 좌우 폭을 «준비 체크리스트» 글자 폭에 맞춤 */
.ckh .r{display:flex;align-items:center;justify-content:space-between;gap:4px}
.ckt{display:flex;gap:3px;background:var(--chip);border-radius:999px;padding:3px}
.ckt button{appearance:none;border:0;background:transparent;border-radius:999px;padding:4px 9px;font-size:12px;color:var(--sub);cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.ckt button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.ckp{font-family:var(--mono);font-size:11px;color:var(--sub);white-space:nowrap}
.cks{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--sub);cursor:pointer;white-space:nowrap}
.cks input{width:13px;height:13px;margin:0}
#ckedit{padding:3px 9px;font-size:12px}
.ckn{margin:8px 0 0;font-size:11.5px;color:var(--faint)}
.ckl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:64px;align-items:start;max-width:1040px;margin:0 auto} /* 가운데 */ /* 묶음을 왼쪽·오른쪽 두 줄로 */
.cg{margin-top:22px}
.cgh{display:flex;align-items:baseline;gap:8px;padding-bottom:4px}
.cgh b{font-size:13.5px;font-weight:600}
.cgh span{font-family:var(--mono);font-size:11px;color:var(--faint)}
.ci{display:flex;align-items:flex-start;gap:11px;padding:8px 2px;cursor:pointer;transition:opacity .3s}
.ci .cb{flex:none;width:19px;height:19px;margin-top:1px;border-radius:50%;border:1.6px solid #c9cfd3;background:#fff;position:relative;transition:background .2s,border-color .2s,transform .2s;padding:0;cursor:pointer}
.ci .cb::after{content:'';position:absolute;left:5.5px;top:2.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.ci.done .cb{background:var(--ink);border-color:var(--ink)}
.ci.done .cb::after{transform:rotate(45deg) scale(1)}
.ci .cb:active{transform:scale(.88)}
.ci .cx2{flex:1;min-width:0}
.ci .ct{font-size:14px;line-height:1.45;color:var(--ink);transition:color .3s}
.ci .ct .must{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;font-size:10px;font-weight:600;line-height:16px;color:#a8281b;background:#fbe9e7;vertical-align:1px}
.ci .cn{margin-top:2px;font-size:12px;line-height:1.5;color:var(--sub)}
.ci.done .ct{color:var(--faint);text-decoration:line-through;text-decoration-color:#d3d8db}
.ci.done .cn{color:#c9cfd3}
.ci.done .ct .must{opacity:.4}
.ck.hidedone .ci.done{display:none}
.ci .cdel{display:none;flex:none;appearance:none;border:1px solid #f0cbc5;background:#fff;color:#b8321f;border-radius:999px;font-size:12px;padding:2px 9px;cursor:pointer}
.ck.editing .ci{cursor:text}
.ck.editing .ci .cb{display:none}
.ck.editing .ci .cdel{display:block}
.ck.editing .ci .ct::after{content:'고치기';margin-left:6px;font-size:11px;color:var(--faint)}
.ci.form{cursor:default;flex-direction:column;gap:6px}
.ci.form input{font:inherit;font-size:13.5px;color:var(--ink);border:1px solid #cfd4d7;border-radius:8px;padding:6px 9px;width:100%}
.ci.form input:focus{outline:2px solid var(--ink);outline-offset:0}
.ci.form .row{display:flex;gap:6px;align-items:center}
.ci.form .err{font-size:11.5px;color:#b8321f}
.cadd{display:none;appearance:none;border:0;background:none;padding:9px 2px;font-size:13px;color:var(--sub);cursor:pointer}
.cadd:hover{color:var(--ink)}
.ck.editing .cadd{display:block}
.ckfoot{display:none;margin-top:26px;justify-content:center}
.ck.editing .ckfoot{display:flex}
.ci.pop{animation:ckpop .35s ease}
@keyframes ckpop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* 편집 모드 */
svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.e.press .ln{stroke:var(--ink);stroke-width:6;transition:stroke-width .55s linear,stroke .2s}
.pl{pointer-events:none;cursor:pointer}
.pl .pi{transform:scale(0);opacity:0;transform-box:fill-box;transform-origin:center;transition:transform .34s cubic-bezier(.34,1.56,.64,1),opacity .18s;transition-delay:inherit}
.editing .pl{pointer-events:auto}
.editing .pl .pi{transform:scale(1);opacity:1}
.pl circle{fill:#fff;stroke:var(--ink);stroke-width:1.5;transition:fill .15s}
.pl path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;transition:stroke .15s}
.pl:hover circle{fill:var(--ink)} .pl:hover path{stroke:#fff}
.editing .n .halo{opacity:.4;stroke-dasharray:2 3}
.editing .n:hover .halo{opacity:1}
.n.pop .dot{animation:pop .5s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.edbar{display:none;align-items:center}
.edbar span{font-size:12.5px;font-weight:600;margin-right:2px}
.editing .acts:not(.edbar){display:none}
.editing .edbar{display:flex;animation:slidein .35s cubic-bezier(.34,1.3,.64,1)}
@keyframes slidein{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.eb{appearance:none;border:1px solid #dfe3e5;background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:400;cursor:pointer}
.eb.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.eb.del{color:#b8321f;border-color:#f0cbc5}
.ed .bd{gap:8px}
.ed h3{margin:0;font-size:14.5px;font-weight:600}
.ed .sub{font-size:11.5px;color:var(--sub);margin-top:-4px}
.ed label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--sub)}
.ed input[type=text],.ed textarea{font:inherit;font-size:13px;color:var(--ink);border:1px solid #cfd4d7;border-radius:8px;padding:6px 9px;width:100%}
.ed textarea{min-height:64px;resize:vertical;line-height:1.5}
.ed input[type=text]:focus,.ed textarea:focus{outline:2px solid var(--ink);outline-offset:0}
.ed .ck{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:12.5px}
.ed .row{display:flex;gap:6px;align-items:center;margin-top:2px}
.ed .row .sp{flex:1}
.ed .why{font-size:11px;color:var(--faint)}
.ed .err{font-size:11.5px;color:#b8321f;margin-top:-4px}
.modes{display:flex;flex-wrap:wrap;gap:5px}
.modes button{display:inline-flex;align-items:center;gap:4px;appearance:none;border:1px solid #dfe3e5;background:#fff;border-radius:999px;padding:3px 9px 3px 6px;font-size:12px;cursor:pointer;color:var(--ink)}
.modes button svg{width:14px;height:14px}
.modes button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.modes.sm{gap:3px;flex-wrap:nowrap}
.modes.sm button{padding:4px 5px}
.ed .seg{display:flex;flex-direction:column;gap:4px}
.ed .sl{font-size:11.5px;color:var(--sub)}
.ed select{font:inherit;font-size:13px;color:var(--ink);border:1px solid #cfd4d7;border-radius:8px;padding:6px 8px;background:#fff;width:100%}
.ed label[hidden]{display:none}
.card.ed{width:324px;max-height:calc(100vh - 24px);overflow:auto;overscroll-behavior:contain}
.card.ed .bd{gap:6px}
.ed textarea{min-height:46px}
.ed .seg input[type=text]{padding:4px 9px}

@media (max-width:700px){
  header{padding:14px 14px 8px}
  h1{font-size:18px}
  .card{left:8px!important;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));top:auto!important;width:auto;transform-origin:center bottom;transform:translateY(24px)}
  .card .x{display:block}
  .card.ed{width:auto;max-height:calc(100vh - 90px)}
  .card .phw{aspect-ratio:16/9}
  .stat span:first-of-type,.stat #off{display:none}
  .stat{gap:10px}
  .ck{padding:0 14px 70px}
  .ckl{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>스위스 자유여행 동선</h1>
    </div>
    <div class="acts">
      <button class="btn" id="reset" type="button">기본 계획</button>
      <button class="btn dark" id="share" type="button">업데이트 하기</button>
    </div>
    <div class="acts edbar" id="edbar"><span>편집 중</span><button class="btn" id="edreset" type="button">원래 일정으로</button><button class="btn dark" id="eddone" type="button">끝내기</button></div>
  </div>
</header>
<div class="stage"><div class="scroller" id="sc"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div></div>

<section class="ck" id="ck" aria-label="준비 체크리스트">
  <div class="ckrow"><button class="ckgo" id="ckgo" type="button"><h2>준비 체크리스트</h2><svg viewBox="0 0 12 18" aria-hidden="true"><path d="M2 2l4 3l4 -3"/><path d="M2 7.5l4 3l4 -3"/><path d="M2 13l4 3l4 -3"/></svg></button><div class="stat"><span>선을 꾹 눌러서 편집</span><span id="sy"></span><span id="off">오프라인 준비 확인 중</span></div></div>
  <div class="ckh">

  var PLACE_FORM = '<label>이름<input type="text" id="f-name" maxlength="30"></label><div class="err" id="f-err" hidden>이름을 써 주세요</div>'+
    '<label>시각<input type="text" id="f-t" maxlength="30" placeholder="10:30, 오전"></label>'+
    '<label>설명<textarea id="f-note" maxlength="400"></textarea></label>'+
    '<label class="ck"><input type="checkbox" id="f-main">주요 관광지 (빨간 점)</label>';
  function openNodeEd(n){
    var can = canDelete(n);
    openEd('<h3>장소 고치기</h3>'+PLACE_FORM+'<div class="row"><button class="eb dark" id="f-ok" type="button">저장</button><button class="eb" id="f-no" type="button">취소</button><span class="sp"></span>'+
      (can?'<button class="eb del" id="f-del" type="button">이 장소 빼기</button>':'')+'</div>'+(can?'':'<div class="why">갈래가 갈라지거나 모이는 곳이라 뺄 수 없어요</div>'), ptOf(n));
    $('f-name').value = n.name; $('f-t').value = pick(n.t); $('f-note').value = n.note||''; $('f-main').checked = !!n.main;
    $('f-name').oninput = function(){ $('f-err').hidden = true; };
    $('f-ok').onclick = function(){
      if(!$('f-name').value.trim()){ $('f-err').hidden = false; return; }
      var p = Object.assign({}, EDIT['n-'+n.id]||{}), v;
      if((v = changed('f-name', n.name))!=null) p.name = v;
      if((v = changed('f-t', pick(n.t)))!=null) p.t = v;
      if((v = changed('f-note', n.note))!=null) p.note = v;
      if($('f-main').checked !== !!n.main) p.main = $('f-main').checked;
      putEdit('n-'+n.id, p, n.name); say('고쳤어요');
    };
    if(can) $('f-del').onclick = function(){
      if(!this.dataset.arm){ this.dataset.arm = '1'; this.textContent = '한 번 더 누르면 빼요'; return; }
      putEdit('n-'+n.id, Object.assign({}, EDIT['n-'+n.id]||{}, {del:1}), n.name); say(n.name+'을(를) 뺐어요');
    };
  }
  function modePicker(box, cur, compact){ // 이동 수단 고르는 칸 (이동 고치기·새 길 카드가 같이 씀)
    var st = {m:cur||'train'};
    Object.keys(MODE).forEach(function(m){
      var b = document.createElement('button'); b.type = 'button'; b.dataset.m = m; b.setAttribute('aria-pressed', m===st.m);
      b.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+m+'"/></svg>';
      if(compact){ b.title = MODE[m]; b.setAttribute('aria-label', MODE[m]); } else b.appendChild(document.createTextNode(MODE[m]));
      b.onclick = function(){ st.m = m; box.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.m===m); }); };
      box.appendChild(b);
    });
    return st;
  }
  function openEdgeEd(e,ev){
    var A = byId[e.a], B = byId[e.b];
    openEd('<h3>이동 고치기</h3><div class="sub" id="f-sub"></div><div class="modes" id="f-modes"></div>'+
      '<label>노선 이름표<input type="text" id="f-r" maxlength="8" placeholder="IC, 103, S16"></label>'+
      '<label>설명<input type="text" id="f-via" maxlength="60"></label>'+
      '<label class="ck"><input type="checkbox" id="f-sep">별매 (6일권 밖, 따로 사는 표)</label>'+
      '<div class="row"><button class="eb dark" id="f-ok" type="button">저장</button><button class="eb" id="f-no" type="button">취소</button><span class="sp"></span>'+
      (e.br?'<button class="eb del" id="f-delbr" type="button">이 갈래 지우기</button>':'')+'</div>', {x:ev.clientX, y:ev.clientY});
    $('f-sub').textContent = A.name+' → '+B.name + (e.brTitle ? ' · 갈래 «'+e.brTitle+'»' : '');
    var mp = modePicker($('f-modes'), e.m);
    $('f-r').value = e.r||''; $('f-via').value = pick(e.via); $('f-sep').checked = !!e.sep;
    $('f-ok').onclick = function(){
      var p = Object.assign({}, EDIT['g-'+e.a+'-'+e.b]||{}), v;
      if(mp.m !== (e.m||'train')) p.m = mp.m;
      if((v = changed('f-r', e.r))!=null) p.r = v;
      if((v = changed('f-via', pick(e.via)))!=null) p.via = v;
      if($('f-sep').checked !== !!e.sep) p.sep = $('f-sep').checked;
      putEdit('g-'+e.a+'-'+e.b, p, A.name+' → '+B.name); say('고쳤어요');
    };
    if(e.br) $('f-delbr').onclick = function(){
      if(!this.dataset.arm){ this.dataset.arm = '1'; this.textContent = '한 번 더 누르면 지워요'; return; }
      var k = 'b-'+e.br; delete EDIT[k]; saveEdit(); queue(k, ''); closeEd(); build(); render(); say('갈래를 지웠어요');
    };
  }
  function openNewEd(e,ev){
    var A = byId[e.a], chains = [{n:byId[e.b], seg:[e]}], cur = e.b, seg = [e];
    while(chains.length<8){ // 끝나는 곳 후보: 바로 옆 점부터, 곁가지 없이 이어지는 데까지
      var ins = R.EDGES.filter(function(x){ return x.b===cur; }), outs = R.EDGES.filter(function(x){ return x.a===cur; });
      if(ins.length!==1 || outs.length!==1) break;
      seg = seg.concat([outs[0]]); cur = outs[0].b; chains.push({n:byId[cur], seg:seg});
    }
    openEd('<h3>새 길</h3><div class="sub" id="f-sub"></div>'+
      '<label>끝나는 곳<select id="f-end"></select></label>'+PLACE_FORM+
      '<div class="seg"><div class="sl">여기까지 오는 길</div><div class="modes sm" id="f-m1"></div><input type="text" id="f-r1" maxlength="8" placeholder="이름표 (IC, 103)"></div>'+
      '<div class="seg"><div class="sl" id="f-l2"></div><div class="modes sm" id="f-m2"></div><input type="text" id="f-r2" maxlength="8" placeholder="이름표 (IC, 103)"></div>'+
      '<label class="ck"><input type="radio" name="f-kind" value="keep" checked>원래 길은 남겨 두기 (희미한 갈래로)</label>'+
      '<label class="ck"><input type="radio" name="f-kind" value="replace">원래 길 대신 이 길로</label>'+
      '<label id="f-tl">갈래 이름<input type="text" id="f-title" maxlength="20" placeholder="비 오면"></label>'+
      '<div class="row"><button class="eb dark" id="f-ok" type="button">만들기</button><button class="eb" id="f-no" type="button">취소</button></div>', {x:ev.clientX, y:ev.clientY});
    $('f-sub').textContent = A.name+'에서 갈라지는 새 길';
    chains.forEach(function(c,i){ var o = document.createElement('option'); o.value = i; o.textContent = c.n.name + (i===0 ? ' (바로 다음)' : ''); $('f-end').appendChild(o); });
    function endName(){ $('f-l2').textContent = chains[$('f-end').value].n.name+'까지 가는 길'; }
    $('f-end').onchange = endName; endName();
    var m1 = modePicker($('f-m1'), e.m, true), m2 = modePicker($('f-m2'), e.m, true);
    $('f-r1').value = $('f-r2').value = e.r||'';
    document.querySelectorAll('input[name=f-kind]').forEach(function(r){ r.onchange = function(){ $('f-tl').hidden = r.value==='replace' && r.checked; placeEd(); }; });
    $('f-name').oninput = function(){ $('f-err').hidden = true; };
    $('f-ok').onclick = function(){
      var name = $('f-name').value.trim(); if(!name){ $('f-err').hidden = false; $('f-name').focus(); return; }
      var c = chains[$('f-end').value], replace = document.querySelector('input[name=f-kind]:checked').value==='replace';
      var id = Date.now().toString(36); justAdded = id+'n0';
      putEdit('b-'+id, {a:e.a, b:c.n.id, seg:c.seg.map(function(x){ return [x.a, x.b]; }),
        via:[{name:name, t:$('f-t').value.trim(), note:$('f-note').value.trim(), main:$('f-main').checked}],
        m1:m1.m, r1:$('f-r1').value.trim(), m2:m2.m, r2:$('f-r2').value.trim(), replace:replace, title:replace?'':$('f-title').value.trim(), ts:Date.now()}, name);
      say(replace ? name+'을(를) 넣었어요' : '새 갈래를 만들었어요 · 누르면 이 길로');
    };
  }
  ed.addEventListener('click',function(ev){ ev.stopPropagation(); });
  $('eddone').addEventListener('click',function(){ setEdit(false); say('편집을 마쳤어요'); });
  $('edreset').addEventListener('click',function(){
    if(!Object.keys(EDIT).length){ say('고친 곳이 없어요'); return; }
    if(!this.dataset.arm){ this.dataset.arm = '1'; this.textContent = '한 번 더 누르면 되돌려요'; return; }
    Object.keys(EDIT).forEach(function(k){ queue(k, ''); });
    EDIT = {}; saveEdit(); closeEd(); build(); render(); setEdit(true); say('원래 일정으로 되돌렸어요');
  });
  addEventListener('keydown',function(ev){ if(ev.key==='Escape'){ if(ed.classList.contains('show')) closeEd(); else if(editing) setEdit(false); } });

  render();

  // ── 준비 체크리스트: 원본(check.js) + 이 기기의 체크·고친 것(route-check, 저장소로 안 보냄) ──
  var CK = window.CHECK || [], cks = document.getElementById('ck'), ckl = document.getElementById('ckl');
  var CS = {done:{}, del:{}, ed:{}, add:[], tab:'todo', hide:false};
  try{ var o = JSON.parse(localStorage.getItem('route-check')||'null'); if(o) CS = Object.assign(CS, o); }catch(e){}
  function ckSave(){ try{ localStorage.setItem('route-check', JSON.stringify(CS)); }catch(e){} }
  var ckEditing = false, ckOpen = null, ckPop = null;
  function ckItems(g){
    var a = g.items.filter(function(it){ return !CS.del[it[0]]; }).map(function(it){
      var e = CS.ed[it[0]] || {}; return {id:it[0], t:e.t!=null?e.t:it[1], n:e.n!=null?e.n:(it[2]||''), m:!!it[3]};
    });
    CS.add.forEach(function(x){ if(x.g===g.id && !CS.del[x.id]) a.push({id:x.id, t:x.t, n:x.n||'', m:false}); });
    return a;
  }
  function ckEl(t,c,txt){ var x=document.createElement(t); if(c) x.className=c; if(txt!=null) x.textContent=txt; return x; }
  function ckForm(item, g, row){ // 줄 고치기·새 줄 넣기 (글은 textContent·value 로만 넣음)
    var f = ckEl('div','ci form'), t = ckEl('input'), n = ckEl('input'), er = ckEl('div','err','내용을 써 주세요'), r = ckEl('div','row');
    t.type = n.type = 'text'; t.maxLength = 80; n.maxLength = 160; t.placeholder = '할 일이나 챙길 것'; n.placeholder = '메모 (선택)';
    t.value = item ? item.t : ''; n.value = item ? item.n : ''; er.hidden = true;
    var ok = ckEl('button','eb dark',item?'저장':'넣기'), no = ckEl('button','eb','취소'); ok.type = no.type = 'button';
    r.appendChild(ok); r.appendChild(no); f.appendChild(t); f.appendChild(er); f.appendChild(n); f.appendChild(r);
    t.oninput = function(){ er.hidden = true; };
    function done(){
      var tv = t.value.trim(); if(!tv){ er.hidden = false; t.focus(); return; }
      if(item){ CS.ed[item.id] = {t:tv, n:n.value.trim()}; }
      else { var id = 'u-'+Date.now().toString(36); CS.add.push({id:id, g:g.id, t:tv, n:n.value.trim()}); ckPop = id; }
      ckOpen = null; ckSave(); ckRender();
    }
    ok.onclick = done; no.onclick = function(){ ckOpen = null; ckRender(); };
    [t,n].forEach(function(x){ x.onkeydown = function(ev){ if(ev.key==='Enter'){ ev.preventDefault(); done(); } else if(ev.key==='Escape'){ ckOpen = null; ckRender(); } }; });
    setTimeout(function(){ t.focus(); }, 30);
    return f;
  }
  function ckRender(){
    cks.classList.toggle('editing', ckEditing); cks.classList.toggle('hidedone', !!CS.hide);
    document.getElementById('ckhide').checked = !!CS.hide;
    document.getElementById('ckedit').textContent = ckEditing ? '끝내기' : '고치기';
    cks.querySelectorAll('.ckt button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.k===CS.tab); });
    ckl.textContent = '';
    var all = 0, did = 0;
    CK.filter(function(g){ return g.k===CS.tab; }).forEach(function(g){
      var items = ckItems(g), gd = items.filter(function(it){ return CS.done[it.id]; }).length;
      all += items.length; did += gd;
      var box = ckEl('div','cg'), h = ckEl('div','cgh'); h.appendChild(ckEl('b','',g.name)); h.appendChild(ckEl('span','',gd+' / '+items.length)); box.appendChild(h);
      items.forEach(function(it){
        if(ckOpen===it.id){ box.appendChild(ckForm(it, g)); return; }
        var row = ckEl('div','ci'+(CS.done[it.id]?' done':'')+(ckPop===it.id?' pop':'')), cb = ckEl('button','cb'), tx = ckEl('div','cx2'), ct = ckEl('div','ct',it.t);
        cb.type = 'button'; cb.setAttribute('role','checkbox'); cb.setAttribute('aria-checked', !!CS.done[it.id]); cb.setAttribute('aria-label', it.t);
        if(it.m) ct.appendChild(ckEl('span','must','필수'));
        tx.appendChild(ct); if(it.n) tx.appendChild(ckEl('div','cn',it.n));
        var del = ckEl('button','cdel','빼기'); del.type = 'button';
        row.appendChild(cb); row.appendChild(tx); row.appendChild(del);
        row.onclick = function(){
          if(ckEditing){ ckOpen = it.id; ckRender(); return; }
          if(CS.done[it.id]) delete CS.done[it.id]; else CS.done[it.id] = 1;
          ckSave(); ckRender();
        };
        del.onclick = function(ev){ ev.stopPropagation(); CS.del[it.id] = 1; delete CS.done[it.id]; ckSave(); ckRender(); say('«'+it.t+'»을(를) 뺐어요'); };
        box.appendChild(row);
      });
      if(ckOpen==='+'+g.id) box.appendChild(ckForm(null, g));
      else { var add = ckEl('button','cadd','+ 항목 추가'); add.type = 'button'; add.onclick = function(){ ckOpen = '+'+g.id; ckRender(); }; box.appendChild(add); }
      ckl.appendChild(box);
    });
    document.getElementById('ckp').textContent = did+' / '+all;
    ckPop = null;
  }
  cks.querySelectorAll('.ckt button').forEach(function(b){ b.onclick = function(){ CS.tab = b.dataset.k; ckOpen = null; ckSave(); ckRender(); }; });
  document.getElementById('ckhide').onchange = function(){ CS.hide = this.checked; ckSave(); ckRender(); };
  document.getElementById('ckedit').onclick = function(){ ckEditing = !ckEditing; ckOpen = null; var r = document.getElementById('ckreset'); r.dataset.arm = ''; r.textContent = '원래 목록으로'; ckRender(); };
  document.getElementById('ckreset').onclick = function(){
    if(!Object.keys(CS.del).length && !Object.keys(CS.ed).length && !CS.add.length){ say('고친 곳이 없어요'); return; }
    if(!this.dataset.arm){ this.dataset.arm = '1'; this.textContent = '한 번 더 누르면 되돌려요 (체크는 남아요)'; return; }
    CS.del = {}; CS.ed = {}; CS.add = []; ckSave(); ckEditing = false; ckRender(); say('원래 목록으로 되돌렸어요');
  };
  document.getElementById('ckgo').onclick = function(){ scrollTo({top: cks.offsetTop - 8, behavior:'smooth'}); };
  function ckWidth(){ document.documentElement.style.setProperty('--tw', document.querySelector('#ckgo h2').getBoundingClientRect().width+'px'); }
  addEventListener('resize', ckWidth); ckWidth(); if(document.fonts && document.fonts.ready) document.fonts.ready.then(ckWidth);
  function ckNear(){ cks.classList.toggle('near', cks.getBoundingClientRect().top < innerHeight*0.45); } // 체크리스트로 넘어가기 전엔 제목이 흐릿
  addEventListener('scroll', function(){ ckNear(); if(scrollY > 80){ if(pinned){ setPin(null); hide(); } closeEd(); } }, {passive:true});
  ckNear();
  ckRender();

  // ── 오프라인 ──
  var off = document.getElementById('off');
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; }).then(check).catch(function(){ off.textContent='오프라인 저장을 못 했어요'; });
    navigator.serviceWorker.addEventListener('message',function(e){ if(e.data && e.data.done) check(); });
  } else off.textContent = '';
  function check(){
    if(!window.caches) return;
    var keys = Object.keys(R.IMG), n = 0;
    caches.open('swiss-route-img').then(function(c){
      return Promise.all(keys.map(function(k){ return c.match(new URL(R.IMG[k].local,location.href).href).then(function(h){ if(h) n++; else return c.match(R.IMG[k].src).then(function(h2){ if(h2) n++; }); }); }));
    }).then(function(){ off.textContent = n===keys.length ? '✓ 오프라인에서도 열려요' : '오프라인 저장 중 · 사진 '+n+'/'+keys.length; if(n<keys.length) setTimeout(check,4000); });
  }
})();
</script>
</body>
</html>
